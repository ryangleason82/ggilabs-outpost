name: Verify production
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-production
  cancel-in-progress: true
jobs:
  verify:
    name: Verify production matches master
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Compare live commit and Git tree to GitHub master
        env:
          OUTPOST_SITE_ACCESS_TOKEN: ${{ secrets.OUTPOST_SITE_ACCESS_TOKEN }}
        run: npm run verify:deployment
